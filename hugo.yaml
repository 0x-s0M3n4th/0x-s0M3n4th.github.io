baseURL: https://0x-s0M3n4th.github.io/
languageCode: en-us
title: 0x-s0M3n4th's Blog
theme: ["PaperMod","hugo-admonitions"]
paginate.pagersize: 5


enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "0x-s0m3n4th's Blog"
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    disableFingerprinting: true
    # favicon: "<link / abs url>"
    # favicon16x16: "<link / abs url>"
    # favicon32x32: "<link / abs url>"
    # apple_touch_icon: "<link / abs url>"
    # safari_pinned_tab: "<link / abs url>"
  comments:
    host: "https://giscus.app"
    repo: "0x-s0M3n4th/0x-s0M3n4th.github.io"
    repoId: "R_kgDOPV2wYg"
    category: "General"
    categoryId: "DIC_kwDOPV2wYs4C1aSa"
    mapping: "url"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "en"
    loading: "lazy"
  label:
    text: ""
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: 0x-s0M3n4th
    subtitle: "Penetration Testing | System Administration | Blue Team Operations. Exploring the depths of Active Directory and low-level coding."
    imageUrl: "images/pfp.jpg"
    imageWidth: 200
    imageHeight: 200
    imageTitle: my image
    buttons:
      - name: Blogs
        url: blogs
      - name: Notes
        url: notes
      - name: Portfolio
        url: portfolio

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: >
      Welcome to my cybersecurity blog where I share my Penetration Testing Notes, Red Teaming experiences, Lab Setups and personal insights. 

  socialIcons:
    - name: x
      tittle: Share the blog on X/twitter
      url: "https://x.com/cyb3r_Insi6ht"
    - name: instagram
      url: "https://www.instagram.com/h4ck_s0mu/"
    - name: github
      url: "https://github.com/0x-s0M3n4th"
    - name: Linkedin
      url: "https://www.linkedin.com/in/somenath-sebait-52575823b/"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: Archive
      name: Archives
      url: /archive/
      weight: 1
    - identifier: Table of contents
      name: Table of contents
      url: /table of contents/
      weight: 2
    - identifier: blogs
      name: Blogs
      url: /blogs/
      weight: 3
    - identifier: notes
      name: Notes
      url: /notes/
      weight: 4
    - identifier: portfolio
      name: Portfolio
      url: /portfolio/
      weight: 7
    - identifier: search
      name: Search 
      url: /search/
      weight: 5
    - identifier: tags
      name: tags
      url: /tags/
      weight: 6
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
taxonomies:
  tag: tags