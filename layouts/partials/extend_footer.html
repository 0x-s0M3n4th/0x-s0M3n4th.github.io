{{ if .Page.Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    
    const initMermaid = () => {
      const isDark = document.body.classList.contains("dark");
      mermaid.initialize({ 
        startOnLoad: false, // Control rendering manually
        theme: isDark ? "dark" : "default" 
      });
      
      // Select all unrendered diagrams
      document.querySelectorAll(".mermaid:not([data-processed='true'])").forEach((el, index) => {
        // Save raw markdown content if not already cached
        if (!el.getAttribute('data-raw')) {
          el.setAttribute('data-raw', el.textContent);
        }
        
        const rawContent = el.getAttribute('data-raw');
        const id = `mermaid-diag-${index}`;
        
        mermaid.render(id, rawContent).then(({ svg }) => {
          el.innerHTML = svg;
          el.setAttribute('data-processed', 'true');
        });
      });
    };

    // Run on initial page load
    window.addEventListener('DOMContentLoaded', initMermaid);

    // Listen for PaperMod's theme toggle click without breaking user flow
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      setTimeout(() => {
        // Clear Mermaid's processed states to allow a redraw
        document.querySelectorAll(".mermaid").forEach(el => {
          el.removeAttribute('data-processed');
          el.innerHTML = el.getAttribute('data-raw') || el.innerHTML;
        });
        initMermaid();
      }, 50); 
    });
  </script>
{{ end }}
