<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  // 1. One-time Setup: Convert Hugo code blocks to persistent Mermaid containers
  const setupMermaidContainers = () => {
    document.querySelectorAll("code.language-mermaid").forEach((codeBlock) => {
      const preElement = codeBlock.parentElement;
      if (!preElement) return;

      const mermaidDiv = document.createElement("div");
      mermaidDiv.className = "mermaid-container";
      mermaidDiv.setAttribute("data-raw", codeBlock.textContent.trim()); 
      
      preElement.replaceWith(mermaidDiv);
    });
  };

  // 2. Render/Re-render Engine: Can be called infinitely safely
  const renderDiagrams = () => {
    const isDark = document.body.classList.contains("dark");
    mermaid.initialize({ 
      startOnLoad: false, 
      theme: isDark ? "dark" : "default" 
    });

    document.querySelectorAll(".mermaid-container").forEach((el, index) => {
      const rawContent = el.getAttribute("data-raw");
      if (!rawContent) return;

      const id = `mermaid-diag-${Date.now()}-${index}`;
      
      mermaid.render(id, rawContent).then(({ svg }) => {
        el.innerHTML = svg;
      }).catch(err => console.error("Mermaid rendering failed:", err));
    });
  };

  // Run everything sequentially on page load
  window.addEventListener('DOMContentLoaded', () => {
    setupMermaidContainers(); // Converts standard code blocks once
    renderDiagrams();         // Renders them the first time
  });

  // Run ONLY the renderer on theme toggle (using the saved data-raw attributes)
  document.getElementById("theme-toggle")?.addEventListener("click", () => {
    setTimeout(renderDiagrams, 50); 
  });
</script>
